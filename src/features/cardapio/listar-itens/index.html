<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de itens do cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <script src="https://kit.fontawesome.com/78b084acaa.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="/styles/styles.css">
</head>


<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #521C0D;">
        <div class="container">
            <a class="navbar-brand text-white fw-semibold" href="/">Cantinaja</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/wallet"><i
                                class="fa-solid fa-wallet me-1"></i>Carteira</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- título -->

    <div class="container gx-5 mx-auto mt-4 row row-cols-1 justify-content-between" id="header-do-cardapio">

        <div class="col-4 mb-4">
            <h1><i class="fa-solid fa-pizza-slice"></i> Cardápio</h1>
        </div>

        <div class="col-3" >
            <select class="form-select" aria-label="Default select example" id="filtro-de-disponiveis">
                <option value="todos">Todos</option>
                <option value="disponiveis">Apenas disponíveis</option>
            </select>
        </div>
        <hr />

    </div>

    <!-- cards -->


    <ul class="container mx-auto gx-5 mt-4 row row-cols-1 row-cols-lg-2" id="itens-do-cardapio" role="list"
        aria-label="Cardápio"></ul>

    

    <p class="container text-center mensagem-lista-vazia text-body-secondary">Não há nenhum item no cardápio no momento!</p>




    
    <!-- modal -->
     
    <ul id="lista-de-modais"></ul>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script type="module" defer src="index.js"></script>

</body>

</html>
