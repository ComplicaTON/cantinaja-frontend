<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de itens do cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <script src="https://kit.fontawesome.com/78b084acaa.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #521C0D;">
        <div class="container">
            <a class="navbar-brand text-white fw-semibold" href="/">Cantinaja</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/wallet"><i
                                class="fa-solid fa-wallet me-1"></i>Carteira</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- título -->

    <div class="container mx-auto mt-4">
        <div class="row row-cols-1 row-cols-lg-2">
            <h1><i class="fa-solid fa-pizza-slice"></i> Cardápio</h1>
        </div>
    </div>

    <!-- cards -->

    <div class="container mx-auto mt-4">
        <div class="row row-cols-1 row-cols-lg-2">
            <div class="col">
                <ul class="list p-0">
                    <li class="card mb-3 g-3 rounded-0 border-start-0 border-end-0" data-bs-toggle="modal"
                        data-bs-target="#Modal-1" style="max-width: 500px; height: 140px;">
                        <div class="row g-0 h-100">
                            <div class="col-12 d-flex flex-column h-100">
                                <div class="card-body d-flex flex-column flex-grow-1"
                                    style="background-color: #F4E7E1;">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <a class="card-link ">
                                                <h4 class="card-title mb-0">Nome do prato</h4>
                                            </a>
                                            <span class="badge badge-disponivel">Disponível</span>
                                        </div>
                                        <span class="d-inline-block text-truncate" style="max-width: 450px;">
                                            descrição
                                        </span>
                                    </div>
                                    <div class="mt-auto">
                                        <p class="card-text mb-0">R$ 30,00</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="col">
                <ul class="list p-0">
                    <li class="card mb-3 g-3 rounded-0 border-start-0 border-end-0" data-bs-toggle="modal"
                        data-bs-target="#Modal-1" style="max-width: 500px; height: 140px;">
                        <div class="row g-0 h-100">
                            <div class="col-12 d-flex flex-column h-100">
                                <div class="card-body d-flex flex-column flex-grow-1"
                                    style="background-color: #F4E7E1;">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <a class="card-link ">
                                                <h4 class="card-title mb-0">Nome do prato</h4>
                                            </a>
                                            <span class="badge badge-indisponivel">Indisponível</span>
                                        </div>
                                        <span class="d-inline-block text-truncate" style="max-width: 450px;">
                                            descrição
                                        </span>
                                    </div>
                                    <div class="mt-auto">
                                        <p class="card-text mb-0">R$ 30,00</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>


    <!-- modal -->

    <div class="modal fade" id="Modal-1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-lg-down">
            <div class="modal-content rounded-0" style="color: #521C0D; background-color: #F4E7E1; border-color: #521C0D;">
                <div class="modal-header" style="border: #F4E7E1;">
                    <h4 class="modal-title fs-5" id="exampleModalLabel">Nome do prato</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>
                        descrição
                    </p>
                    <p>R$ 30,00</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>

</html>
