<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de itens do cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <script src="https://kit.fontawesome.com/78b084acaa.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #521C0D;">
        <div class="container">
            <a class="navbar-brand text-white fw-semibold" href="/">Cantinaja</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/wallet"><i
                                class="fa-solid fa-wallet me-1"></i>Carteira</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- título -->

    <div class="container gx-5 mx-auto mt-4 row row-cols-1 justify-content-between" id="header-do-cardapio">

        <div class="col-4 mb-4">
            <h1><i class="fa-solid fa-pizza-slice"></i> Cardápio</h1>
        </div>

        <div class="col-3" id="filtro-de-disponiveis">
            <select class="form-select" aria-label="Default select example">
                <option selected>Todos</option>
                <option value="1">Apenas disponíveis</option>
            </select>
        </div>
        <hr />

    </div>

    <!-- cards -->


    <ul class="container mx-auto gx-5 mt-4 row row-cols-1 row-cols-lg-2" id="itens-do-cardapio" role="list"
        aria-label="Cardápio">


        <!-- card disponível -->

        <li class="col">


            <article class="card mb-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#Modal-1">


                <div class="card-body d-flex flex-column flex-grow-1">

                    <header class="d-flex justify-content-between align-items-center mb-2">
                        <a href="#" class="card-link">
                            <h4 class="card-title mb-0">Nome do prato</h4>
                        </a>
                        <span class="badge badge-disponivel">Disponível</span>
                    </header>

                    <p class="card-text text-truncate">Descrição do prato</p>

                    <footer class="mt-auto">
                        <p class="card-text mb-0">R$ 30,00</p>
                    </footer>

                </div>


            </article>

        </li>


        <!-- card indisponível -->

        <!-- <li class="col">


            <article class="card mb-4 shadow-sm">


                <div class="card-body d-flex flex-column flex-grow-1">

                    <header class="d-flex justify-content-between align-items-center mb-2">
                        <a href="#" class="card-link">
                            <h4 class="card-title mb-0">Nome do prato</h4>
                        </a>
                        <span class="badge badge-indisponivel">Indisponível</span>
                    </header>

                    <p class="card-text text-truncate">Descrição do prato</p>

                    <footer class="mt-auto">
                        <p class="card-text mb-0">R$ 30,00</p>
                    </footer>

                </div>


            </article>


        </li> -->


    </ul>

    <div class="container text-center">
        <p class="mensagem-lista-vazia text-body-secondary">Não há nenhum item no cardápio no momento!</p>
    </div>

    <!-- modal -->
    <ul id="lista-de-modais">
        <li class="modal fade" id="Modal-1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <article class="modal-dialog modal-dialog-centered modal-fullscreen-lg-down">
                <div class="modal-content">
                    <header class="modal-header">
                        <h4 class="modal-title fs-5" id="exampleModalLabel">Nome do prato</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </header>
                    <div class="modal-body">
                        <p>descrição</p>
                    </div>
                    <footer class="modal-footer me-auto">
                        <p>R$ 30,00</p>
                    </footer>
                </div>
            </article>
        </li>
    </ul>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script defer src="index.js"></script>

</body>

</html>
