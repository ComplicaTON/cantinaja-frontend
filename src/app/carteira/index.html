<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extrato</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../css/style.css" />

  </head>

  <body class="bg-light p-4">
    <div
      class="container bg-white p-4 rounded shadow-sm container-card"
      style="max-width: 900px"
    >
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 m-0">
          <i class="bi bi-wallet2 me-2"></i>Extrato da Carteira
        </h2>

        <button
          id="btnVerExtrato"
          class="btn btn-custom"
          data-bs-toggle="modal"
          data-bs-target="#modalExtrato"
        >
          <i class="bi bi-eye me-1"></i> Ver extrato
        </button>
      </div>

      <div id="areaExtrato">
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-4">
            <div class="card card-stat bg-success-subtle p-3">
              <small class="text-secondary fw-bold">TOTAL RECARREGADO</small>
              <span id="totalRecarregado" class="fs-4 fw-bold text-success"
                >R$ 0,00</span
              >
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="card card-stat bg-danger-subtle p-3">
              <small class="text-secondary fw-bold">TOTAL GASTO</small>
              <span id="totalGasto" class="fs-4 fw-bold text-danger"
                >R$ 0,00</span
              >
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="card card-stat bg-primary-subtle p-3">
              <small class="text-secondary fw-bold">SALDO DISPONÍVEL</small>
              <span id="saldoAtual" class="fs-4 fw-bold text-primary"
                >R$ 0,00</span
              >
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">Histórico</h5>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalExtrato" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-content-custom">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalExtratoLabel">
              <i class="bi bi-receipt me-2"></i>Consulte seu extrato
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
              <span class="fw-semibold text-secondary me-1">Filtrar por:</span>

              <div class="btn-group" role="group" id="filtrosExtrato">
                <button
                  type="button"
                  class="btn btn-sm btn-outline-custom active"
                  data-filtro="TODAS"
                >
                  Todas
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-custom"
                  data-filtro="RECARGA"
                >
                  Somente recargas
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-custom"
                  data-filtro="DEBITO"
                >
                  Somente débitos
                </button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="tabelaModalCorpo"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../mocks/mock.js"></script>

    <script src="../../features/carteira/extrato/extrato.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
